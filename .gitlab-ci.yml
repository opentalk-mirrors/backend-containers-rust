---
image:
  name: registry.heinlein.group/opentalk-tools/kaniko:debug-1.25.15
  pull_policy: if-not-present
  entrypoint: ['']

include: '**/.gitlab-ci.yml'

stages:
  - lint
  - build
  - push

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_MAJOR: 1
  RUST_MINOR: 99
  RUST_PATCH: 1
  RUST_VERSION: $RUST_MAJOR.$RUST_MINOR.$RUST_PATCH

lint:licensing:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  stage: lint
  image:
    name: fsfe/reuse:6.2
    entrypoint: ['']
    pull_policy: if-not-present
  script:
    - reuse lint
