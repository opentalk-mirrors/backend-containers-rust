---
image:
  name: git.opentalk.dev:5050/opentalk/opentalk-devops/containers/kaniko:debug-1.25.2
  pull_policy: if-not-present
  entrypoint: ['']

include: '**/.gitlab-ci.yml'

stages:
  - lint
  - build

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_MAJOR: 1
  RUST_MINOR: 95
  RUST_PATCH: 0
  RUST_VERSION: $RUST_MAJOR.$RUST_MINOR.$RUST_PATCH

lint:licensing:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  stage: lint
  image:
    name: fsfe/reuse:latest
    entrypoint: ['']
  script:
    - reuse lint
