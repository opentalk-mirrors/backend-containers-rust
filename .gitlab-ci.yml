---
image:
  name: gcr.io/kaniko-project/executor:debug
  entrypoint: ['']

include: '**/.gitlab-ci.yml'

stages:
  - lint
  - build

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_VERSION: 1.66.1
  RUST_MAJOR: 1
  RUST_MINOR: 66
  RUST_PATCH: 1

lint:licensing:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
  stage: lint
  image:
    name: fsfe/reuse:latest
    entrypoint: ['']
  script:
    - reuse lint
