build:alpine3.14:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  stage: build
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo
      "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" >
      /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/$CARGO_VERSION/alpine3.14/Dockerfile
      --cache=false
      --destination $CI_REGISTRY_IMAGE:$CARGO_MAJOR-alpine3.14
      --destination $CI_REGISTRY_IMAGE:$CARGO_MAJOR.$CARGO_MINOR-alpine3.14
      --destination $CI_REGISTRY_IMAGE:$CARGO_MAJOR.$CARGO_MINOR.$CARGO_PATCH-alpine3.14
      --destination $CI_REGISTRY_IMAGE:alpine3.14
      --destination $CI_REGISTRY_IMAGE:$CARGO_MAJOR-alpine
      --destination $CI_REGISTRY_IMAGE:$CARGO_MAJOR.$CARGO_MINOR-alpine
      --destination $CI_REGISTRY_IMAGE:$CARGO_MAJOR.$CARGO_MINOR.$CARGO_PATCH-alpine
      --destination $CI_REGISTRY_IMAGE:alpine
      --build-arg CARGO_VERSION=$CARGO_VERSION
      --force
