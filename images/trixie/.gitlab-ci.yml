---
build:trixie:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  stage: build
  script:
    - mkdir -p /kaniko/.docker
    - >
      if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        export KANIKO_EXTRA_ARGS="--no-push"
      fi
    - >
      echo
      "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" >
      /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --registry-mirror=mirror.gcr.io
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/images/trixie/Dockerfile
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR-trixie
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR.$RUST_MINOR-trixie
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR.$RUST_MINOR.$RUST_PATCH-trixie
      --destination $CI_REGISTRY_IMAGE:trixie
      --build-arg RUST_VERSION=$RUST_VERSION
      --force
      $KANIKO_EXTRA_ARGS
    - >
      TAGS="$RUST_MAJOR-trixie $RUST_MAJOR.$RUST_MINOR-trixie $RUST_MAJOR.$RUST_MINOR.$RUST_PATCH-trixie trixie"
    - echo "TAGS=$TAGS" > package.env
  artifacts:
    reports:
      dotenv: package.env

push-and-sign:trixie:
  needs:
    - build:trixie
  rules:
    - if: $CI_COMMIT_TAG != null
  stage: push
  variables:
    PIPELINE_FULL_IMAGE_NAME: $CI_REGISTRY_IMAGE
    PIPELINE_NAMESPACE_SUFFIX: rust
  trigger:
    project: opentalk/opentalk-devops/push-and-sign-images-for-the-opentalk-tools-namespace
    strategy: depend
    forward:
      pipeline_variables: true
      
build:trixie-slim:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  stage: build
  script:
    - mkdir -p /kaniko/.docker
    - >
      if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        export KANIKO_EXTRA_ARGS="--no-push"
      fi
    - >
      echo
      "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" >
      /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --registry-mirror=mirror.gcr.io
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/images/trixie/slim/Dockerfile
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR-slim-trixie
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR.$RUST_MINOR-slim-trixie
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR.$RUST_MINOR.$RUST_PATCH-slim-trixie
      --destination $CI_REGISTRY_IMAGE:slim-trixie
      --build-arg RUST_VERSION=$RUST_VERSION
      --force
      $KANIKO_EXTRA_ARGS
    - >
      TAGS="$RUST_MAJOR-slim-trixie $RUST_MAJOR.$RUST_MINOR-slim-trixie $RUST_MAJOR.$RUST_MINOR.$RUST_PATCH-slim-trixie slim-trixie"
    - echo "TAGS=$TAGS" > package.env
  artifacts:
    reports:
      dotenv: package.env

push-and-sign:trixie-slim:
  needs:
    - build:trixie-slim
  rules:
    - if: $CI_COMMIT_TAG != null
  stage: push
  variables:
    PIPELINE_FULL_IMAGE_NAME: $CI_REGISTRY_IMAGE
    PIPELINE_NAMESPACE_SUFFIX: rust
  trigger:
    project: opentalk/opentalk-devops/push-and-sign-images-for-the-opentalk-tools-namespace
    strategy: depend
    forward:
      pipeline_variables: true
