---
build:alpine-3.22.2:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  stage: build
  script:
    - mkdir -p /kaniko/.docker
    - >
      if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        export KANIKO_EXTRA_ARGS="--no-push"
      fi
    - >
      echo
      "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" >
      /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --registry-mirror=mirror.gcr.io
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/images/alpine-3.22.2/Dockerfile
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR-alpine-3.22.2
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR.$RUST_MINOR-alpine-3.22.2
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR.$RUST_MINOR.$RUST_PATCH-alpine-3.22.2
      --destination $CI_REGISTRY_IMAGE:alpine-3.22.2
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR-alpine
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR.$RUST_MINOR-alpine
      --destination $CI_REGISTRY_IMAGE:$RUST_MAJOR.$RUST_MINOR.$RUST_PATCH-alpine
      --destination $CI_REGISTRY_IMAGE:alpine
      --build-arg RUST_VERSION=$RUST_VERSION
      --force
      $KANIKO_EXTRA_ARGS
    - >
      TAGS="$RUST_MAJOR-alpine-3.22.2 $RUST_MAJOR.$RUST_MINOR-alpine-3.22.2 $RUST_MAJOR.$RUST_MINOR.$RUST_PATCH-alpine-3.22.2 $RUST_MAJOR-alpine $RUST_MAJOR.$RUST_MINOR-alpine $RUST_MAJOR.$RUST_MINOR.$RUST_PATCH-alpine alpine"
    - echo "TAGS=$TAGS" > package.env
  artifacts:
    reports:
      dotenv: package.env

push-and-sign:alpine-3.22.2:
  needs:
    - build:alpine-3.22.2
  rules:
    - if: $CI_COMMIT_TAG != null
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  stage: push
  variables:
    PIPELINE_FULL_IMAGE_NAME: $CI_REGISTRY_IMAGE
    PIPELINE_NAMESPACE_SUFFIX: rust
  trigger:
    project: opentalk/opentalk-devops/push-and-sign-images-for-the-opentalk-tools-namespace
    strategy: depend
    forward:
      pipeline_variables: true
